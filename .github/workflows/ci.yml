name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for docker compose
        run: cp .env.example .env

      - name: Build web image
        run: docker compose build web

      - name: Start db, redis, web
        run: docker compose up -d db redis web

      - name: Wait for web to be healthy
        run: |
          timeout 90 bash -c 'until curl -sf http://localhost:8000/api/v1/geo/continents/ >/dev/null; do sleep 2; done'

      - name: Run backend test suite
        # Race tests have their own job (plain PostgreSQL, config.settings.workspace_pg_test).
        run: docker compose exec -T web pytest -q --ignore=apps/workspaces/test_concurrency.py

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

  # Zetrix v2 on its own minimal requirements; the race tests need real PostgreSQL row locks.
  backend-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ZETRIX_PG_HOST: 127.0.0.1
      ZETRIX_PG_PASSWORD: pg
      V2_APPS: apps.workspaces apps.scenario_engine apps.evidence apps.decisions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements/mvp.txt

      - name: Install dependencies
        run: pip install -r requirements/mvp.txt

      - name: Migrations are in sync with models
        run: python -m django makemigrations workspaces evidence decisions --check --dry-run --settings=config.settings.workspace_test

      - name: Tests on SQLite
        run: python -m django test $V2_APPS --settings=config.settings.workspace_test

      - name: Tests and race tests on PostgreSQL
        run: python -m django test $V2_APPS --settings=config.settings.workspace_pg_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run test suite
        run: npm test
