name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for docker compose
        run: cp .env.example .env

      - name: Build web image
        run: docker compose build web

      - name: Start db, redis, web
        run: docker compose up -d db redis web

      - name: Wait for web to be healthy
        run: |
          timeout 90 bash -c 'until curl -sf http://localhost:8000/api/v1/geo/continents/ >/dev/null; do sleep 2; done'

      - name: Run backend test suite
        run: docker compose exec -T web pytest -q

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run test suite
        run: npm test
